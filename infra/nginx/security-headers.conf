# Security headers, in an include because nginx does not inherit them.
#
# `add_header` is not additive across levels: the moment a location declares one of its own, every
# add_header from the enclosing server block is dropped for that location. Declared once at server
# level, these four therefore applied to /api/ and nothing else — not to index.html, which is the
# one response whose CSP actually matters. Every location that sets a header of its own includes
# this file explicitly instead.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
