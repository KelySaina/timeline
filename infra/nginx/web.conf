server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Photos and API responses are private; nothing here should ever be cached by a proxy.
  # Every location that sets an add_header of its own re-includes this — see the file for why.
  include /etc/nginx/snippets/security-headers.conf;

  # The API sets its own security headers with helmet, because in development it is reached directly
  # with no proxy in front. Behind nginx both apply, and `add_header` appends rather than replaces —
  # so every /api/ response was carrying two Referrer-Policy values, two X-Content-Type-Options, and
  # two CONFLICTING X-Frame-Options: helmet's SAMEORIGIN alongside this file's DENY. Dropping the
  # upstream's copies leaves exactly one of each, and the stricter value. Inherited by every
  # proxied location.
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header X-Content-Type-Options;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # The change stream is a long-lived response, so it needs the opposite of what a normal proxied
  # request wants: no buffering (the API also sends X-Accel-Buffering: no), no read timeout short
  # enough to cut a quiet connection, and no gzip buffer sitting in front of it.
  location = /api/stream {
    proxy_pass http://api:4281;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # The export is one response that can run to gigabytes and take minutes: it is built while it is
  # sent, so nginx must not buffer it to disk first, and the generic 120s read timeout below is not
  # enough for a large object store fetch mid-archive.
  location = /api/export {
    # No security-headers include here, unlike the static locations below: this location sets no
    # add_header of its own, so it inherits the server-level ones. Including them again would send
    # every one of them twice. Same reasoning as /api/stream and /api/.
    proxy_pass http://api:4281;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:4281;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
    proxy_read_timeout 120s;
  }

  # nginx's mime.types has no entry for .webmanifest, so it would go out as octet-stream and the
  # install prompt would never appear. Set per-location, NOT with a server-level `types` block —
  # that one replaces the inherited map wholesale and turns every other response into octet-stream.
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Not content-hashed, so not immutable — but re-fetching the icon set on every launch is waste.
  location /icons/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1d;
    try_files $uri =404;
  }

  # The worker itself must never be cached, or a bad one becomes permanent. It falls under
  # `location /` below, which sets no-store — spelled out here because it is load-bearing.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Hashed assets are immutable; index.html must never be.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
