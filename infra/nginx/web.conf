server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Photos and API responses are private; nothing here should ever be cached by a proxy.
  # Every location that sets an add_header of its own re-includes this — see the file for why.
  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://api:4281;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
    proxy_read_timeout 120s;
  }

  # Hashed assets are immutable; index.html must never be.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
