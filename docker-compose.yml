name: timeline

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timeline}
      POSTGRES_USER: ${POSTGRES_USER:-timeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-timeline} -d ${POSTGRES_DB:-timeline}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Photo storage. Private bucket, no anonymous policy, no port published to the host.
  minio:
    # MinIO deleted minio/minio and minio/mc from Docker Hub in September 2026, and quay.io
    # stopped serving them anonymously days later, so the old pinned tags cannot be fetched at
    # all any more — not a rate limit, the repositories are gone. This is Chainguard's free
    # source-built image of the same AGPL server, which still publishes publicly.
    #
    # Pinned by digest because the free tier carries no version tags, only :latest — and a
    # floating tag on the thing that holds the photos is exactly what this file avoids
    # everywhere else. To move to a newer build deliberately:
    #   docker pull cgr.dev/chainguard/minio:latest
    #   docker inspect cgr.dev/chainguard/minio:latest --format '{{index .RepoDigests 0}}'
    # The digest below is an OCI index covering linux/amd64 and linux/arm64.
    image: cgr.dev/chainguard/minio@sha256:a05a4497e8dce3cb7a7a1bf1872ba5d30ea988f1e8c22c9e0920503761c4b5f1
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT:-9401}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [internal]

  # One-shot: creates the bucket, asserts it is private, and mints the *scoped* key the API uses,
  # so root credentials never leave this service. Re-running it is a no-op.
  minio-init:
    # The same image as the server above, not a separate client one: it already carries both
    # `mc` and a shell, and Chainguard's minio-client image is distroless, so the /bin/sh
    # entrypoint below would have nothing to run. One image also means one digest to bump.
    image: cgr.dev/chainguard/minio@sha256:a05a4497e8dce3cb7a7a1bf1872ba5d30ea988f1e8c22c9e0920503761c4b5f1
    entrypoint: ['/bin/sh', '/etc/minio-bootstrap/bootstrap.sh']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-timeline-photos}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      # setup.sh --rotate sets this so an existing key's secret is actually replaced.
      FORCE_KEY_ROTATION: ${FORCE_KEY_ROTATION:-false}
    volumes:
      - ./infra/minio:/etc/minio-bootstrap:ro
    depends_on:
      minio:
        condition: service_started
    restart: 'no'
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4281
      DATABASE_URL: postgres://${POSTGRES_USER:-timeline}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-timeline}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4280}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-timeline-photos}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: 'true'
      # Web push. Empty unless .env carries a pair (scripts/vapid-keys.sh, or re-run setup.sh):
      # the API treats all three as optional together and simply does not offer notifications.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # WEB_BIND=127.0.0.1 when a reverse proxy terminates TLS in front of this.
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-4280}:80'
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  db-data:
  minio-data:

networks:
  # The database and the photo store are never published to the host by this file.
  internal:
    driver: bridge
