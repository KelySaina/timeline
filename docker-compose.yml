name: timeline

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timeline}
      POSTGRES_USER: ${POSTGRES_USER:-timeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-timeline} -d ${POSTGRES_DB:-timeline}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Photo storage. Private bucket, no anonymous policy, no port published to the host.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT:-9401}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [internal]

  # One-shot: creates the bucket, asserts it is private, and mints the *scoped* key the API uses,
  # so root credentials never leave this service. Re-running it is a no-op.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ['/bin/sh', '/etc/minio-bootstrap/bootstrap.sh']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-timeline-photos}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      # setup.sh --rotate sets this so an existing key's secret is actually replaced.
      FORCE_KEY_ROTATION: ${FORCE_KEY_ROTATION:-false}
    volumes:
      - ./infra/minio:/etc/minio-bootstrap:ro
    depends_on:
      minio:
        condition: service_started
    restart: 'no'
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4281
      DATABASE_URL: postgres://${POSTGRES_USER:-timeline}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-timeline}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4280}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-timeline-photos}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # WEB_BIND=127.0.0.1 when a reverse proxy terminates TLS in front of this.
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-4280}:80'
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  db-data:
  minio-data:

networks:
  # The database and the photo store are never published to the host by this file.
  internal:
    driver: bridge
